[project]
name = "model-port"
version = "0.1.0"
description = "Multi-vendor ModelOps gateway for AI model fine-tuning, registry, and rollout"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "typer[all]>=0.27.2",
  "rich>=15.0.0",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
registry = [
  # Cap below 0.27: newer wandb tightened client-side API-key validation
  # (requires a 40+ char secret) and rejects the local W&B server's
  # `wandb_v1_` keys, which the server itself accepts.
  "wandb>=0.30.0,<0.31",
]
train = [
  "torch>=2.14.0",
  "torchvision>=0.29.0",
  "transformers>=5.17.0",
  "datasets>=5.0.1",
  "accelerate>=1.15.0",
  "peft>=0.20.0",
  "trl>=1.13.0",
  "pillow>=12.3.0",
  "num2words>=0.5.14",
  "bitsandbytes>=0.50.2; platform_system == 'Linux'",
  "pandas>=3.0.5",
  "scikit-learn>=1.9.0",
  "onnx>=1.22.0",
  "onnxruntime>=1.29.0",
  "wandb>=0.30.0,<0.31",
]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.6",
]
api = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["model_port*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
